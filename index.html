<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Топ-100 итд</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      background: #fafafa;
      color: #222;
    }
    h1 { font-size: 28px; margin-bottom: 8px; }
    .subtitle { color: #555; margin-bottom: 24px; font-size: 14px; }
    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .add-form input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }
    .add-form button {
      padding: 10px 20px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    .add-form button:hover { background: #444; }
    .add-form button:disabled { background: #999; cursor: wait; }
    .status { font-size: 14px; margin-bottom: 16px; min-height: 20px; }
    .status.error { color: #c00; }
    .status.ok { color: #080; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 15px;
    }
    th {
      background: #f5f5f5;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #555;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }
    .rank { font-weight: 700; color: #888; width: 40px; }
    .clan { font-size: 22px; width: 60px; text-align: center; }
    .verified { color: #1d9bf0; margin-left: 4px; }
    .empty { text-align: center; color: #999; padding: 40px; }
    .loading { text-align: center; color: #666; padding: 40px; }
  </style>
</head>
<body>
  <h1>Топ-100 итд</h1>
  <p class="subtitle">Добавьте username, чтобы отслеживать аккаунт.</p>

  <form class="add-form" id="addForm">
    <input type="text" id="usernameInput" placeholder="Введите username" autocomplete="off" required>
    <button type="submit" id="addBtn">Добавить</button>
  </form>

  <div class="status" id="status"></div>

  <table>
    <thead>
      <tr>
        <th class="rank">#</th>
        <th class="clan">Клан</th>
        <th>Username</th>
        <th>Имя</th>
        <th>Подписчики</th>
        <th>Подписки</th>
        <th>Посты</th>
      </tr>
    </thead>
    <tbody id="rows">
      <tr><td colspan="7" class="loading">Загрузка...</td></tr>
    </tbody>
  </table>

  <script>
    const rowsEl = document.getElementById('rows');
    const statusEl = document.getElementById('status');
    const form = document.getElementById('addForm');
    const input = document.getElementById('usernameInput');
    const addBtn = document.getElementById('addBtn');

    function setStatus(text, type) {
      statusEl.textContent = text;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    async function loadTop() {
      try {
        const res = await fetch('/top100');
        const data = await res.json();
        if (!data.length) {
          rowsEl.innerHTML = '<tr><td colspan="7" class="empty">Пока никого нет. Добавьте первого пользователя.</td></tr>';
          return;
        }
        rowsEl.innerHTML = data.map((u, i) => `
          <tr>
            <td class="rank">${i + 1}</td>
            <td class="clan">${u.clanEmoji || '—'}</td>
            <td>${u.username}</td>
            <td>${u.displayName || '—'}${u.verified ? '<span class="verified">✔</span>' : ''}</td>
            <td>${u.followers}</td>
            <td>${u.following}</td>
            <td>${u.posts}</td>
          </tr>
        `).join('');
      } catch (e) {
        rowsEl.innerHTML = '<tr><td colspan="7" class="empty">Ошибка загрузки данных</td></tr>';
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = input.value.trim().replace(/^@/, '');
      if (!username) return;

      addBtn.disabled = true;
      setStatus('Добавляем...', '');

      try {
        const res = await fetch('/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username })
        });
        const data = await res.json();

        if (!res.ok) {
          setStatus(data.error || 'Ошибка добавления', 'error');
          return;
        }

        setStatus(`Добавлено: ${username}.`, 'ok');
        input.value = '';
        await loadTop();
        setStatus(`Готово. Всего отслеживается: ${data.count}`, 'ok');
      } catch (e) {
        setStatus('Ошибка сети', 'error');
      } finally {
        addBtn.disabled = false;
      }
    });

    loadTop();
  </script>
</body>
</html>
