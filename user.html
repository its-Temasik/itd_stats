<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статистика аккаунта</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: #fafafa;
      color: #222;
    }
    a.back { color: #555; text-decoration: none; font-size: 14px; }
    a.back:hover { color: #000; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      margin-top: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }
    .clan-big { font-size: 56px; line-height: 1; }
    .name { font-size: 22px; font-weight: 700; }
    .username { color: #666; font-size: 15px; }
    .verified { color: #1d9bf0; margin-left: 4px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat {
      background: #f7f7f7;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
    }
    .stat .value { font-size: 24px; font-weight: 700; }
    .stat .label { font-size: 13px; color: #666; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .updated { font-size: 13px; color: #888; text-align: center; }
    .empty { text-align: center; color: #999; padding: 40px; }
    @media (max-width: 500px) {
      .stats-grid { grid-template-columns: 1fr; }
      .clan-big { font-size: 40px; }
    }
  </style>
</head>
<body>
  <a class="back" href="/">← Назад к топу</a>
  <div class="card" id="card">
    <div class="empty">Загрузка...</div>
  </div>

  <script>
    function formatNumber(n) {
      if (n == null) return '—';
      if (n < 1000) return String(n);
      if (n < 10000) return (n / 1000).toFixed(2) + 'к';
      if (n < 100000) return (n / 1000).toFixed(1) + 'к';
      return Math.round(n / 1000) + 'к';
    }

    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleString('ru-RU', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    const params = new URLSearchParams(location.search);
    const username = params.get('username');
    const card = document.getElementById('card');

    if (!username) {
      card.innerHTML = '<div class="empty">Не указан username</div>';
    } else {
      document.title = `Статистика: ${username}`;
      fetch('/user/' + encodeURIComponent(username))
        .then(r => r.json())
        .then(data => {
          if (data.error) {
            card.innerHTML = `<div class="empty">${data.error}</div>`;
            return;
          }
          card.innerHTML = `
            <div class="header">
              <div class="clan-big">${data.clanEmoji || '—'}</div>
              <div>
                <div class="name">${data.displayName || '—'}${data.verified ? '<span class="verified">✔</span>' : ''}</div>
                <div class="username">@${data.username}</div>
              </div>
            </div>
            <div class="stats-grid">
              <div class="stat">
                <div class="value">${formatNumber(data.followers)}</div>
                <div class="label">Подписчики</div>
              </div>
              <div class="stat">
                <div class="value">${formatNumber(data.following)}</div>
                <div class="label">Подписки</div>
              </div>
              <div class="stat">
                <div class="value">${formatNumber(data.posts)}</div>
                <div class="label">Посты</div>
              </div>
            </div>
            <div class="updated">Обновлено: ${formatDate(data.updatedAt)}</div>
          `;
        })
        .catch(() => {
          card.innerHTML = '<div class="empty">Ошибка загрузки данных</div>';
        });
    }
  </script>
</body>
</html>
