<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Статистика аккаунта</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #fafafa;
      color: #222;
    }
    a.back { color: #555; text-decoration: none; font-size: 14px; }
    a.back:hover { color: #000; }

    .card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      margin-top: 16px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }

    /* Баннер */
    .banner {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 32px 24px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .banner .clan-big { font-size: 72px; line-height: 1; }
    .banner .info .name { font-size: 24px; font-weight: 700; }
    .banner .info .username { font-size: 15px; opacity: 0.85; margin-top: 4px; }
    .banner .info .verified { color: #ffd700; margin-left: 4px; }
    .banner .info .profile-link {
      display: inline-block;
      margin-top: 10px;
      background: rgba(255,255,255,0.2);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 13px;
      transition: background 0.15s;
    }
    .banner .info .profile-link:hover { background: rgba(255,255,255,0.35); }

    /* Статистика */
    .content { padding: 24px; }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat {
      background: #f7f7f7;
      border-radius: 10px;
      padding: 18px;
      text-align: center;
    }
    .stat .value { font-size: 26px; font-weight: 700; }
    .stat .label { font-size: 12px; color: #666; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Рейтинги */
    .ranks {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }
    .rank-item {
      background: #f0f7ff;
      border: 1px solid #d6e6ff;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
    }
    .rank-item .place { font-size: 22px; font-weight: 700; color: #1d4ed8; }
    .rank-item .rank-label { font-size: 12px; color: #555; margin-top: 4px; }
    .rank-item .total { font-size: 11px; color: #888; margin-top: 2px; }

    .updated { font-size: 13px; color: #888; text-align: center; }
    .empty { text-align: center; color: #999; padding: 40px; }

    @media (max-width: 550px) {
      .banner { flex-direction: column; text-align: center; padding: 24px 16px; }
      .banner .clan-big { font-size: 56px; }
      .stats-grid, .ranks { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <a class="back" href="/">← Назад к топу</a>
  <div class="card" id="card">
    <div class="empty">Загрузка...</div>
  </div>

  <script>
    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso);
      return d.toLocaleString('ru-RU', {
        day: '2-digit', month: '2-digit', year: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function formatFull(n) {
      if (n == null) return '—';
      return n.toLocaleString('ru-RU'); // 262834 → "262 834"
    }

    const params = new URLSearchParams(location.search);
    const username = params.get('username');
    const card = document.getElementById('card');

    if (!username) {
      card.innerHTML = '<div class="empty">Не указан username</div>';
    } else {
      document.title = `Статистика: ${username}`;
      fetch('/user/' + encodeURIComponent(username))
        .then(r => r.json())
        .then(data => {
          if (data.error) {
            card.innerHTML = `<div class="empty">${data.error}</div>`;
            return;
          }
          const profileUrl = `https://итд.com/@${encodeURIComponent(data.username)}`;
          card.innerHTML = `
            <div class="banner">
              <div class="clan-big">${data.clanEmoji || '—'}</div>
              <div class="info">
                <div class="name">${data.displayName || '—'}${data.verified ? '<span class="verified">✔</span>' : ''}</div>
                <div class="username">@${data.username}</div>
                <a class="profile-link" href="${profileUrl}" target="_blank" rel="noopener">Открыть в итд →</a>
              </div>
            </div>
            <div class="content">
              <div class="stats-grid">
                <div class="stat">
                  <div class="value">${formatFull(data.followers)}</div>
                  <div class="label">Подписчики</div>
                </div>
                <div class="stat">
                  <div class="value">${formatFull(data.following)}</div>
                  <div class="label">Подписки</div>
                </div>
                <div class="stat">
                  <div class="value">${formatFull(data.posts)}</div>
                  <div class="label">Посты</div>
                </div>
              </div>

              <div class="ranks">
                <div class="rank-item">
                  <div class="place">#${data.rankFollowers}</div>
                  <div class="rank-label">по подписчикам</div>
                  <div class="total">из ${data.totalUsers}</div>
                </div>
                <div class="rank-item">
                  <div class="place">#${data.rankFollowing}</div>
                  <div class="rank-label">по подпискам</div>
                  <div class="total">из ${data.totalUsers}</div>
                </div>
                <div class="rank-item">
                  <div class="place">#${data.rankPosts}</div>
                  <div class="rank-label">по постам</div>
                  <div class="total">из ${data.totalUsers}</div>
                </div>
              </div>

              <div class="updated">Обновлено: ${formatDate(data.updatedAt)}</div>
            </div>
          `;
        })
        .catch(() => {
          card.innerHTML = '<div class="empty">Ошибка загрузки данных</div>';
        });
    }
  </script>
</body>
</html>
